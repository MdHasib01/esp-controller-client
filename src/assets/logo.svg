<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background & Tile Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Cyan/Neon Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bfaff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0091ff" />
    </linearGradient>

    <linearGradient id="pulsePin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#5bfaff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Ambient Radial Glow -->
  <circle cx="256" cy="270" r="190" fill="url(#ambientGlow)" />

  <!-- Microchip / Circuit Traces (ESP32 IoT Aesthetic) -->
  <g stroke="#00f0ff" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#neonGlow)">
    <!-- Left PCB Traces -->
    <path d="M 120 200 L 80 200 L 64 216" stroke-width="6" />
    <circle cx="64" cy="216" r="6" fill="#00f0ff" stroke="none" />

    <path d="M 110 270 L 60 270" stroke-width="7" />
    <circle cx="56" cy="270" r="7" fill="#00f0ff" stroke="none" />

    <path d="M 126 340 L 86 340 L 72 354" stroke-width="6" />
    <circle cx="72" cy="354" r="6" fill="#00f0ff" stroke="none" />

    <!-- Right PCB Traces -->
    <path d="M 392 200 L 432 200 L 448 216" stroke-width="6" />
    <circle cx="448" cy="216" r="6" fill="#00f0ff" stroke="none" />

    <path d="M 402 270 L 452 270" stroke-width="7" />
    <circle cx="456" cy="270" r="7" fill="#00f0ff" stroke="none" />

    <path d="M 386 340 L 426 340 L 440 354" stroke-width="6" />
    <circle cx="440" cy="354" r="6" fill="#00f0ff" stroke="none" />

    <!-- Top Corner Circuit Traces -->
    <path d="M 170 120 L 150 100 L 110 100" stroke-width="6" />
    <circle cx="106" cy="100" r="6" fill="#00f0ff" stroke="none" />

    <path d="M 342 120 L 362 100 L 402 100" stroke-width="6" />
    <circle cx="406" cy="100" r="6" fill="#00f0ff" stroke="none" />
  </g>

  <!-- High-Power Glow Underlayer -->
  <g filter="url(#coreGlow)" opacity="0.85">
    <!-- Power Arc Glow -->
    <path
      d="M 334 186 A 118 118 0 1 1 178 186"
      stroke="#00f0ff"
      stroke-width="34"
      stroke-linecap="round"
    />
    <!-- Center Pin Glow -->
    <line
      x1="256"
      y1="126"
      x2="256"
      y2="260"
      stroke="#5bfaff"
      stroke-width="34"
      stroke-linecap="round"
    />
  </g>

  <!-- Foreground Crisp Power Symbol -->
  <g>
    <!-- Crisp Power Ring Arc -->
    <path
      d="M 334 186 A 118 118 0 1 1 178 186"
      stroke="url(#cyanNeon)"
      stroke-width="32"
      stroke-linecap="round"
    />

    <!-- Crisp Center Vertical Pin -->
    <line
      x1="256"
      y1="126"
      x2="256"
      y2="260"
      stroke="url(#pulsePin)"
      stroke-width="32"
      stroke-linecap="round"
    />

    <!-- Center Indicator Core Node -->
    <circle cx="256" cy="126" r="8" fill="#ffffff" />
    <circle cx="256" cy="270" r="14" fill="#5bfaff" opacity="0.9" />
    <circle cx="256" cy="270" r="6" fill="#ffffff" />
  </g>
</svg>